<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eff4e9"><title>どうぶつビンゴ</title>
<style>
:root{font:16px/1.55 system-ui,sans-serif;color:#203c2e;background:#eff4e9;--green:#27573e;--line:#d5e2d4;--cream:#fffdf6;--red:#a9362b}*{box-sizing:border-box}body{margin:0}header{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1050px;margin:auto;padding:19px 20px}header a{color:inherit;text-decoration:none;font-weight:700}header a+a{font-size:14px}main{max-width:490px;margin:auto;padding:12px 16px 40px}main.admin{max-width:1020px}h1,h2,p{margin:0}h1{line-height:1.14;font-size:clamp(29px,7vw,44px);letter-spacing:-.05em}h2{font-size:21px}.panel{background:var(--cream);border:1px solid var(--line);border-radius:23px;padding:clamp(15px,4vw,26px);display:grid;gap:14px}.hero{text-align:center;padding-block:34px}.animals{display:flex;justify-content:center;gap:8px;margin:5px 0 14px}.animals span{display:grid;place-items:center;width:27%;aspect-ratio:1;border-radius:30% 40% 32% 45%;background:#dfeccf;font-size:clamp(34px,10vw,64px);transform:rotate(-9deg)}.animals span:nth-child(2){background:#f7dfab;transform:translateY(-10px) rotate(6deg)}.animals span:nth-child(3){background:#f5dcd1;transform:rotate(10deg)}button,input,select{font:inherit;color:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:11px;padding:8px 13px;background:#fff;cursor:pointer;font-weight:650}button:disabled{opacity:.55;cursor:default}button.primary{background:var(--green);border-color:var(--green);color:white}button.active{background:#dbead7;border-color:#488263}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #886019;outline-offset:2px}.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tile{position:relative;display:grid;place-items:center;align-content:center;gap:2px;min-width:0;aspect-ratio:1.14;padding:4px;font-size:clamp(11px,3vw,14px);line-height:1.2;overflow:hidden}.art{font-size:clamp(25px,8vw,42px);line-height:1.15;width:100%;height:auto;max-height:62px;object-fit:contain}.tile img{height:clamp(30px,9vw,57px)}.tile.win{background:#f9e8b6;border-color:#9a6a1d}.stamp{position:absolute;display:grid;place-items:center;inset:0;margin:auto;width:82%;aspect-ratio:1.38;border:3px double #ab3d2d;border-radius:48%;background:#fff0e3e8;color:var(--red);font-weight:900;transform:rotate(-13deg);font-size:clamp(11px,3.5vw,16px);padding:2px;overflow-wrap:anywhere;pointer-events:none}.fresh .stamp{animation:stamp .28s ease-out}.winner{color:var(--red);font-size:22px;font-weight:850}.pool .tile{aspect-ratio:auto;min-height:67px}.pool .art{font-size:29px}.pool .tile img{height:34px}.muted{color:#52665b;font-size:14px}.error{color:#a1271d;font-weight:650}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.draw{min-height:220px;text-align:center;display:grid;place-content:center;justify-items:center;gap:5px;background:#e3eddb;border-radius:18px;padding:18px}.draw .art{font-size:90px;height:100px;max-height:100px}.draw strong{font-size:27px}.land .art{animation:pop .38s cubic-bezier(.15,.8,.4,1.25)}.history{display:flex;gap:6px;flex-wrap:wrap;align-content:start}.chip{border:1px solid var(--line);background:#fff;padding:4px 8px;border-radius:8px}.entries{display:grid;gap:6px}.entry{display:grid;grid-template-columns:38px minmax(65px,1fr) auto auto;align-items:center;gap:7px;border-bottom:1px solid var(--line);padding:4px 0}.entry .art{font-size:24px;width:36px;height:34px}.entry button{padding:5px 8px}.entry label{font-size:14px}form,fieldset{display:grid;gap:10px}label{display:grid;gap:4px}input[type=text],input[type=password],input[type=file]{width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:white}label.check{display:flex;align-items:center;gap:7px;min-height:44px}.words{display:flex;flex-wrap:wrap;gap:7px}.word{display:flex;gap:5px;align-items:center;padding:0 8px;background:white;border-radius:9px;border:1px solid var(--line)}.word button{border:0}.notice{margin:0 0 10px}.wide{width:100%}@keyframes stamp{from{transform:translateY(-23px) scale(1.55) rotate(-20deg);opacity:0}to{transform:rotate(-13deg);opacity:1}}@keyframes pop{from{transform:scale(.65)}to{transform:scale(1)}}@media(max-width:630px){.columns{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
<header><a href="/">🐾 どうぶつビンゴ</a><a href="/?admin">管理画面</a></header><main id="app"></main>
<script type="module" src="/app.js"></script></html>
